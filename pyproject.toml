[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-namer"
version = "1.0.0"
description = "Automatically rename media files to Plex naming conventions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
keywords = ["plex", "media", "rename", "movies", "tv shows", "organizing"]

[project.optional-dependencies]
tmdb = ["requests>=2.25.0"]
rich = ["rich>=13.0.0"]
tui = ["textual>=0.40.0"]
all = ["requests>=2.25.0", "textual>=0.40.0"]

[project.scripts]
plex-namer = "plex_namer:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/plex-namer"
Issues = "https://github.com/YOUR_USERNAME/plex-namer/issues"
